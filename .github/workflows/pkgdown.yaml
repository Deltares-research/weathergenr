# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Pages serves the reviewed, committed docs/ directory from master.
# This workflow validates the site build. Refresh docs/ with the local site
# tools and include the generated output in the reviewed commit.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Vignettes are Quarto (.qmd); pkgdown needs the CLI to render articles.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every *.md in the package root -- package_mds() globs
      # them and drops only a hardcoded list (README, NEWS, LICENSE, issue
      # templates). There is no ignore mechanism, and .Rbuildignore does not
      # apply because pkgdown reads the source tree, not the tarball. The agent
      # instruction files have to sit at the repo root for discovery,
      # so they are removed here instead. Mirrors
      # .strip_dev_only_md() in tools/build_site_tools.R, which does the same for
      # local builds; keep the two lists in step.
      - name: Drop dev-only pages pkgdown rendered
        run: rm -f docs/AGENTS.md docs/AGENTS.html

      - name: Rebuild site indexes after dropping dev-only pages
        run: |
          pkgdown::build_search()
          pkgdown:::build_sitemap()
        shell: Rscript {0}
