# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Deploys the pkgdown site to the `gh-pages` branch. Until the repository's
# Pages source is switched from `/docs` to `gh-pages`, the committed `docs/`
# directory remains the live site — see AGENTS.md § Key Commands for the
# cutover sequence.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Vignettes are Quarto (.qmd); pkgdown needs the CLI to render articles.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # pkgdown renders every *.md in the package root -- package_mds() globs
      # them and drops only a hardcoded list (README, NEWS, LICENSE, issue
      # templates). There is no ignore mechanism, and .Rbuildignore does not
      # apply because pkgdown reads the source tree, not the tarball. The agent
      # instruction files have to sit at the repo root for Codex and Claude Code
      # to find them, so they are removed here instead. Mirrors
      # .strip_dev_only_md() in tools/build_site_tools.R, which does the same for
      # local builds; keep the two lists in step.
      - name: Drop dev-only pages pkgdown rendered
        run: rm -f docs/AGENTS.md docs/AGENTS.html docs/CLAUDE.md docs/CLAUDE.html

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
