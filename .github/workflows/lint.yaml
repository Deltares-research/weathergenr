# Runs the repo's own lint helper (tools/lint.R) in CI.
#
# NOTE: the full-package mode is deliberate. `tools/lint.R --changed` diffs the
# working tree against HEAD, which is always clean after checkout — in CI it
# would report "no changed R files" and pass without linting anything. Keep
# `--changed` for local pre-commit use only.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      # Blocking. The package lints clean under the .lintr baseline, so a new
      # finding is a regression and should fail the branch rather than be
      # reported and scrolled past.
      #
      # Where a variable is used only inside a `.log()` message, the use is
      # inside a `{}` interpolation evaluated in the caller's frame, which lintr
      # cannot see. Those sites carry a per-line
      # `# nolint: object_usage_linter.` rather than the linter being disabled
      # for the file, so a genuinely dead local in the same function is still
      # reported.
      - name: Lint
        run: Rscript tools/lint.R
