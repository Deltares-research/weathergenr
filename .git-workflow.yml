# git-workflow ceremony + opt-in versioning.
#
# `mode: full` is stated explicitly to preserve the behavior that applied
# before this file existed (an absent file already resolves to `full`), so
# adding versioning changes no Git behavior on its own.
mode: full

# This repository's remote is public/shared, so a push is a publishing act, not
# a backup. git-workflow's auto-push checkpoint does not apply here.
auto_push: false

# Opt-in release policy per brain ADR 0020. The policy helper is read-only:
# it validates this configuration and plans releases. It never edits the
# carrier, tags, publishes, commits, or pushes.
versioning:
  cadence: manual
  adapters:
    - id: weathergenr
      type: command
      scheme: r-package
      root: .
      # DESCRIPTION#Version is authoritative; NEWS.md is kept in sync.
      carrier: DESCRIPTION#Version
      history: NEWS.md
      # Reference behavior, not an automated executor — an agent or the owner
      # runs these deliberately at a release gate.
      apply: ["Rscript", "-e", "usethis::use_version()"]
      # Release gate. `document = FALSE` keeps this a no-write validation path:
      # check_only() otherwise regenerates man/ and NAMESPACE, and a validator
      # must not mutate the tree it is validating.
      #
      # Not `tools/lint.R --changed`: that diffs the working tree against HEAD,
      # which is clean at a release gate by definition, so it passed having
      # linted nothing. Nor plain `tools/lint.R` — full-package mode currently
      # exits 1 on the .lintr baseline's 28 findings and would block every
      # release (tracked as t2608061641).
      validate: ["Rscript", "-e", "source('tools/build_site_tools.R'); check_only(build_vignettes = TRUE, document = FALSE)"]
      # Existing R CMD check and pkgdown workflows are retained unchanged and
      # are not wired as a release command.
      release:
